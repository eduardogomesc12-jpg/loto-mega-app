name: ECG - Inteligência Estatística Gratuita
on:
  push:
    branches: [main]
    paths:
      - "scripts/generate-ai-report.mjs"
      - ".github/workflows/ecg-ai-report.yml"
  schedule:
    - cron: "15 21 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ecg-report-publication
  cancel-in-progress: false
jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar sintaxe do motor local
        run: node --check scripts/generate-ai-report.mjs
      - name: Gerar inteligência estatística sem API externa
        run: node scripts/generate-ai-report.mjs
      - name: Publicar JSON atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/inteligencia.json
          if git diff --cached --quiet; then
            echo "Sem alterações"
          else
            git commit -m "Atualiza inteligência estatística gratuita ECG"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
