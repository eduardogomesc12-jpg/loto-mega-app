name: ECG - análise estatística diária
on:
  schedule:
    - cron: "5 21 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ecg-statistical-report
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Gerar relatório estatístico
        run: python3 scripts/ecg_daily_analysis.py
      - name: Publicar relatório no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/latest.json
          git diff --cached --quiet || git commit -m "Atualizar relatório estatístico diário"
          git push
