name: ECG - análise estatística diária
on:
  push:
    branches: [main]
    paths:
      - "scripts/ecg_daily_analysis.py"
      - "tests/**"
      - ".github/workflows/ecg-statistics.yml"
  schedule:
    - cron: "5 21 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ecg-statistical-report
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar sintaxe e testes estatísticos
        run: |
          python -m py_compile scripts/ecg_daily_analysis.py
          python -m unittest discover -s tests -p "test_*.py" -v
      - name: Gerar relatório com dados validados
        run: python scripts/ecg_daily_analysis.py
      - name: Publicar relatório no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/latest.json
          if git diff --cached --quiet; then echo "Relatório sem alterações"; else git commit -m "Atualizar relatório estatístico diário" && git push; fi
